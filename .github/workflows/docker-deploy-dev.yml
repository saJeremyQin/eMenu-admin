name: Build and Deploy to ECS Dev

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'Dockerfile'
      - '.dockerignore'
  workflow_dispatch:  # 允许手动触发

jobs: 
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
    
    env:
      # 开发环境特定的配置
      ENVIRONMENT: dev
      ECR_REPOSITORY: emenu/emenu-admin-dev
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-2.amazonaws.com
      AWS_REGION: ap-southeast-2
      ECS_CLUSTER: emenu-admin-dev-cluster
      ECS_SERVICE: emenu-admin-dev-service
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  # 更新版本

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4  # 更新版本
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2  # 更新版本

      - name: Build and tag docker image
        run: |
          # 使用简短的SHA作为标签，更易读
          IMAGE_TAG="${GITHUB_SHA::10}"
          FULL_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          
          echo "🔨 Building Docker image for $ENVIRONMENT environment..."
          echo "📦 Image: $FULL_IMAGE_URI"
          
          # Build docker image
          docker build -t "$FULL_IMAGE_URI" .
          
          # 只标记 latest，ECS 任务定义使用这个
          docker tag "$FULL_IMAGE_URI" "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          
          # 保存变量供后续步骤使用
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "FULL_IMAGE_URI=$FULL_IMAGE_URI" >> $GITHUB_ENV

      - name: Push image to ECR
        run: |
          echo "📤 Pushing images to ECR..."
          docker push "$FULL_IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "✅ Successfully pushed all tags"
          
          # 等待一下确保镜像完全可用
          echo "⏱️  Waiting for ECR to propagate images..."
          sleep 10

      - name: Deploy to ECS
        run: |
          echo "🚀 Deploying to ECS $ENVIRONMENT environment..."
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION
          
          echo "⏳ Waiting for deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION \
            --cli-read-timeout 900 \
            --cli-connect-timeout 60
          
          echo "✅ Deployment completed successfully!"

      - name: Get deployment status
        if: always()
        run: |
          echo "📊 Current service status:"
          aws ecs describe-services \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --query 'services[0].{TaskDefinition:taskDefinition,RunningCount:runningCount,DesiredCount:desiredCount,Status:status}' \
            --output table \
            --region $AWS_REGION